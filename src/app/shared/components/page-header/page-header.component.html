<header class="page-header">
  @if (breadcrumbs().length > 0) {
    <nz-breadcrumb class="page-header__breadcrumb" aria-label="Ruta de navegación">
      @for (item of breadcrumbs(); track item.label; let last = $last) {
        <nz-breadcrumb-item>
          @if (item.route && !last) {
            <a [routerLink]="item.route">{{ item.label }}</a>
          } @else {
            <span [attr.aria-current]="last ? 'page' : null">{{ item.label }}</span>
          }
        </nz-breadcrumb-item>
      }
    </nz-breadcrumb>
  }

  <div class="page-header__row">
    <div class="page-header__text">
      <h1 class="page-header__title">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="page-header__subtitle">{{ subtitle() }}</p>
      }
    </div>

    <div class="page-header__actions">
      <ng-content select="[pageHeaderActions]" />
    </div>
  </div>
</header>
